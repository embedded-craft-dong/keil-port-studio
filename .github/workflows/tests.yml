name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.12', '3.14']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile-check the tool
        run: python -m compileall -q keil_port_tool.py kps_core
      - name: Run regression tests
        shell: pwsh
        run: |
          python tools/run_tests.py test-results
          exit $LASTEXITCODE
      - name: Retain regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: test-results/
